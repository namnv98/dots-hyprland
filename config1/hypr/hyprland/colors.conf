# exec = export SLURP_ARGS='-d -c 9EEFFEBB -b 006E7B44 -s 00000000'

general {
    col.active_border = rgba(DEE2EF39)
    col.inactive_border = rgba(8791A530)
}

misc {
    background_color = rgba(0F141CFF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(0F141CFF)
        col.text = rgba(DEE2EFFF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(DEE2EF), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(DEE2EF), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(DEE2EF), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrulev2 = bordercolor rgba(50D8EDAA) rgba(50D8ED77),pinned:1