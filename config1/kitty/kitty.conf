# Font
# font_family      SpaceMono Nerd Font
font_size 11.0

# Cursor shape
cursor_shape beam

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish -c "neofetch; exec fish"

# Copy for normies
map ctrl+c       copy_or_interrupt
map ctrl+v       paste_from_clipboard
map ctrl+x       send_text all \x03
map ctrl+l       send_text all clear\n

# Zoom
map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1

map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1

map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_sizex all 0


# -- color scheme --
# background_opacity 0.9
background_blur 0
# background #000000


# BEGIN_KITTY_FONTS
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        12.5




 


# BEGIN_KITTY_THEME
# Ayu
include current-theme.conf
# END_KITTY_THEME